# Tests every pull request, then deploys it to the staging preview site
# (no approval). On main, tests again, then applies D1 migrations and deploys
# the Worker to production. The production job uses the "production"
# environment, which waits for a manual approval in GitHub before it starts.
#
# Actions are pinned to commit SHAs (version in the trailing comment) because
# tags can be moved to point at different code.

name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- run

  staging:
    name: Deploy preview to staging
    needs: test
    # Pull requests from forks don't get secrets, so only same-repo branches deploy.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://fairplay-wizard-staging.jeremywall.workers.dev
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply fairplay-staging --remote --env staging

      - name: Check that no migrations are pending
        run: |
          pending=$(npx wrangler d1 migrations list fairplay-staging --remote --env staging)
          echo "$pending"
          echo "$pending" | grep -q "No migrations to apply"

      - name: Deploy Worker
        run: npx wrangler deploy --env staging

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 3 https://fairplay-wizard-staging.jeremywall.workers.dev/app/home | grep -q "Coach sign in"

  deploy:
    name: Migrate and deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fairplay-wizard.jeremywall.workers.dev
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Migrations must be applied before the code that depends on them.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply fairplay --remote

      - name: Check that no migrations are pending
        run: |
          pending=$(npx wrangler d1 migrations list fairplay --remote)
          echo "$pending"
          echo "$pending" | grep -q "No migrations to apply"

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 3 https://fairplay-wizard.jeremywall.workers.dev/app/home | grep -q "Coach sign in"
