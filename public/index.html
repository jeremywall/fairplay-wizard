<!doctype html>
<html lang="en" class="scheme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Fairplay Wizard</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Fairplay">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- No page snapshots in localStorage: back/forward reloads the address instead. -->
  <meta name="htmx-config" content='{"historyCacheSize":0,"refreshOnHistoryMiss":true}'>
  <link rel="stylesheet" href="/css/output.css">
  <script src="/js/htmx.min.js" defer></script>
  <script src="/js/app.js" defer></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-700 bg-slate-900 pt-[env(safe-area-inset-top)]">
    <div class="mx-auto max-w-3xl px-[max(1rem,env(safe-area-inset-left))] py-4">
      <a class="text-lg font-bold text-emerald-400" href="/">Fairplay Wizard</a>
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-[max(1rem,env(safe-area-inset-left))] pt-8 pb-[calc(2rem+env(safe-area-inset-bottom))]" id="main">
    <p class="text-center text-slate-400">Loading…</p>
  </main>
</body>
</html>
